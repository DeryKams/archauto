# =============================================================================
# /etc/tlp.conf — TLP конфигурация для ThinkPad T14s Gen 6 AMD
# Железо: Ryzen AI 7 PRO 360, Radeon 880M iGPU, 58Wh батарея, 1TB NVMe
# =============================================================================

# =============================================================================
# ОСНОВНЫЕ НАСТРОЙКИ
# =============================================================================

# TLP 1.10 использует три профиля: performance (AC), balanced (BAT), power-saver (SAV)
# Если питание не определено (десктоп/ВМ), использовать balanced
TLP_DEFAULT_MODE=BAL

# 0 = режим зависит от источника питания (AC/BAT)
# 1 = всегда использовать TLP_DEFAULT_MODE (для устройств без батареи)
TLP_PERSISTENT_DEFAULT=0

# =============================================================================
# ПРОЦЕССОР (AMD Ryzen AI 7 PRO 360 — Strix Point)
# =============================================================================

# --- Режим работы amd-pstate драйвера ---
# active — EPP работает, recommended для Ryzen AI
# passive — нет EPP, только governor
# guided — hardware управляет частотами, нет EPP
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

# --- Scaling governor ---
# Для amd-pstate active: powersave (рекомендуется) или performance
# powersave + EPP=power даёт лучшее энергосбережение
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# --- Energy Performance Preference (EPP) ---
# КЛЮЧЕВАЯ настройка! ppd оставлял balance_performance — это НЕ энергосбережение.
# Значения для amd-pstate-epp:
#   performance  — максимальная производительность
#   balance_performance — баланс со склонностью к скорости
#   balance_power — баланс со склонностью к экономии
#   power — максимальное энергосбережение
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# --- Turbo Boost ---
# 0 = выключить turbo, 1 = включить
# На батарее можно выключить для экономии, но это сильно режет производительность
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- Мин/макс частота (кГц) ---
# Не указываем — пусть driver и governor управляют частотами
# Включение этих настроек может ограничить производительность
# CPU_SCALING_MIN_FREQ_ON_AC=400000   # 400 MHz минимальная
# CPU_SCALING_MAX_FREQ_ON_AC=3700000   # 3.7 GHz максимальная (без boost)
# CPU_SCALING_MIN_FREQ_ON_BAT=400000
# CPU_SCALING_MAX_FREQ_ON_BAT=2700000  # 2.7 GHz на батарее

# =============================================================================
# ПЛАТФОРМА (Platform Profile)
# =============================================================================

# Platform profile управляется прошивкой (BIOS/ACPI)
# performance — максимальная скорость вентилятора и power
# balanced — баланс
# low-power — минимум, тишина, энергосбережение
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# =============================================================================
# ГРАФИКА (AMD Radeon 880M iGPU)
# =============================================================================

# AMD GPU DPM (Dynamic Power Management) performance level
# auto — driver управляет (рекомендуется)
# low — принудительно низкий уровень (сэкономит ~1-2 Вт, но GPU будет медленным)
# high — принудительно высокий
# ВАЖНО: на Strix Point amdgpu может не корректно переходить в D3 на Linux.
# Это известная проблема kernel/firmware, не конфигурации TLP.
AMD_GPU_DPM_PERFORMANCE_LEVEL_ON_AC=auto
AMD_GPU_DPM_PERFORMANCE_LEVEL_ON_BAT=auto

# =============================================================================
# PCIe RUNTIME POWER MANAGEMENT (Runtime PM)
# =============================================================================

# Включить runtime PM для PCIe устройств
# auto — ядро управляет sleep/wake устройств
RUNTIME_PM_ON_AC=on              # на AC: on = не засыпать (для производительности)
RUNTIME_PM_ON_BAT=auto           # на батарее: auto = засыпать неиспользуемые

# Denylist — драйверы, которым нельзя засыпать (могут не проснуться)
# amdgpu — GPU может не корректно проснуться на Strix Point, НЕ добавляем
# mei_me — Management Engine, нужен для системных функций
# nouveau/nvidia — для дискретных GPU (у нас нет dGPU, но на всякий случай)
# xhci_hcd — USB контроллер, засыпание может ломать USB
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau nvidia xhci_hcd"

# =============================================================================
# PCIe ASPM (Active State Power Management)
# =============================================================================

# Включить ASPM для энергосбережения PCIe link
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# =============================================================================
# ДИСКИ (NVMe + SATA)
# =============================================================================

# NVMe runtime power management
# ВАЖНО: nvme0n1 — единственный диск, используется для системы
# AHCI runtime PM для NVMe/SATA/USB дисков
AHCI_RUNTIME_PM_ON_AC=on         # на AC: не засыпать диск
AHCI_RUNTIME_PM_ON_BAT=auto      # на батарее: засыпать при простое

# NVMe APST (Autonomous Power State Transition)
# TLP не управляет NVMe APST напрямую (это в руках ядра и firmware)
# Но можно ограничить через udev правила, если нужно

# I/O scheduler для NVMe
# nvme: none (простой, без планировщика — для быстрых SSD)
# SATA SSD: mq-deadline (упорядочивает запросы)
DISK_DEVICES="nvme0n1"
DISK_IOSCHED="nvme0n1:none"

# =============================================================================
# СЕТЬ (Wi-Fi + Ethernet)
# =============================================================================

# Wi-Fi power save
# off — выключить (стабильно, но больше потребление)
# on — включить (экономит ~0.3-0.5 Вт, но может вызывать instability)
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Wake-On-LAN — выключить (не будить машину по сети)
WOL_DISABLE=Y

# =============================================================================
# AUDIO
# =============================================================================

# Audio power save — выключать audio codec при простое
# 1 — включить (секунды до засыпания), 0 — выключить
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1

# Power down controller вместе с codec
SOUND_POWER_SAVE_CONTROLLER=Y

# =============================================================================
# USB
# =============================================================================

# USB autosuspend — засыпать неиспользуемые USB устройства
USB_AUTOSUSPEND_ON_AC=on         # на AC: on = не засыпать (стабильно)
USB_AUTOSUSPEND_ON_BAT=auto      # на батарее: auto = засыпать

# Denylist — USB устройства, которым нельзя засыпать
# Realtek RTL8153 Ethernet adapter — известен проблемами с autosuspend
# USB hubs — не засыпать (чтобы подключённые устройства работали)
USB_DENYLIST="046d:c534 0bda:8153"

# =============================================================================
# БАТАРЕЯ (ThinkPad charge thresholds)
# =============================================================================

# ThinkPads поддерживают ограничение заряда батареи для продления срока службы
# START_CHARGE_THRESH — начать зарядку при разряде до этого уровня
# STOP_CHARGE_THRESH — остановить зарядку при достижении этого уровня
# Рекомендация: 75/80 для повседневной работы (батарея живёт дольше)
# Полная зарядка (100%) каждый раз ускоряет деградацию Li-ion

START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# Для второго аккумулятора (если есть)
# START_CHARGE_THRESH_BAT1=75
# STOP_CHARGE_THRESH_BAT1=80

# =============================================================================
# BLUETOOTH
# =============================================================================

# Выключать Bluetooth при загрузке и на батарее
DEVICES_TO_DISABLE_ON_BAT="bluetooth"
DEVICES_TO_ENABLE_ON_AC="bluetooth"

# =============================================================================
# РАДИО (Radio Device Wizard)
# =============================================================================

# Выключать Wi-Fi при подключении Ethernet (экономит ~0.2 Вт)
# ВАЖНО: может мешать, если используешь Wi-Fi как primary — тогда закомментируй
# RADIO_DEVICE_POLICY_ON_LAN_CONNECT=keep_off_wifi
# RADIO_DEVICE_POLICY_ON_LAN_DISCONNECT=restore_wifi

# =============================================================================
# ФАЙЛОВАЯ СИСТЕМА
# =============================================================================

# Laptop mode — накопление записей в cache перед сбросом на диск
# Уменьшает обращения к NVMe → экономит энергию
NMI_WATCHDOG=0

# =============================================================================
# ИТОГ
# =============================================================================
# После применения: sudo tlp-start
# Проверка: tlp-stat -b (батарея), tlp-stat -p (процессор), tlp-stat -s (статус)
# Полный отчёт: tlp-stat