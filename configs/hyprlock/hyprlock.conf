# =============================================================================
# hyprlock.conf — Экран блокировки в стиле liquid glass
# Конфиг лежит в ~/.config/hypr/hyprlock.conf (симлинк из archauto/configs/hypr/)
# =============================================================================

# --- Общие настройки ---
general {
    hide_cursor = false              # показывать курсор
    ignore_empty_input = false       # не игнорировать пустой пароль
    immediate_render = true          # рисовать сразу (не ждать загрузки обоев)
    fail_timeout = 2000              # сброс UI после неудачного ввода (мс)
}

# --- Анимации ---
animations {
    enabled = true
}

bezier = easeOutCubic, 0.05, 0.9, 0.1, 1.0
animation = fade, 1, 1.5, easeOutCubic

# =============================================================================
# ВИДЖЕТЫ
# =============================================================================

# --- Фон: обои с blur (liquid glass) ---
# path = screenshot — использует текущий экран как фон (размытый)
# Можно заменить на путь к файлу обоев:
#   path = /usr/share/backgrounds/greeter.jpg
# screenshot даёт эффект "замороженного" рабочего стола — как macOS Lock Screen.
background {
    monitor =
    path = screenshot                # размытый снимок текущего экрана
    color = rgba(17, 17, 27, 1.0)    # запасной цвет (Catppuccin Mocha base)
    blur_passes = 3                  # 3 прохода dual kawase blur (как в niri)
    blur_size = 7                    # размер blur
    noise = 0.02                     # шум от цветовых полос
    contrast = 0.89                  # контраст blur
    brightness = 0.82                # затемнение blur (читаемость текста)
    vibrancy = 0.17                  # насыщенность
    vibrancy_darkness = 0.05
}

# --- Часы (большие, по центру вверху) ---
label {
    monitor =
    text = $TIME                     # 24-часовой формат (например 13:37)
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = JetBrains Mono Nerd Font

    position = 0, 120                # 120px вверх от центра
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# --- Дата (под часами) ---
label {
    monitor =
    text = cmd[update:3600000] echo "$(date '+%A, %d %B')"  # день недели, число, месяц
    color = rgba(255, 255, 255, 0.6)
    font_size = 28
    font_family = JetBrains Mono Nerd Font

    position = 0, 40                 # 40px вверх от центра (под часами)
    halign = center
    valign = center
}

# --- Имя пользователя (под датой) ---
label {
    monitor =
    text = Hi, $USER
    color = rgba(127, 200, 255, 0.8)  # голубой (#7fc8ff — как focus-ring в niri)
    font_size = 22
    font_family = JetBrains Mono Nerd Font

    position = 0, -10                 # чуть ниже центра
    halign = center
    valign = center
}

# --- Поле ввода пароля (центр, liquid glass) ---
input-field {
    monitor =
    size = 400, 60                   # ширина 400px, высота 60px
    outline_thickness = 3            # толщина рамки
    dots_size = 0.25                 # размер точек индикатора пароля
    dots_spacing = 0.15              # расстояние между точками
    dots_center = true               # точки по центру

    # Цвета — голубой акцент как в niri (#7fc8ff)
    outer_color = rgba(127, 200, 255, 0.9)    # рамка — голубая
    inner_color = rgba(30, 30, 46, 0.6)       # внутри — полупрозрачный тёмный
    font_color = rgba(205, 214, 244, 1.0)     # текст — светло-лавандовый

    # Цвет при проверке пароля — жёлтый
    check_color = rgba(229, 192, 123, 0.9)
    # Цвет при ошибке — красный
    fail_color = rgba(243, 139, 168, 0.9)
    fail_text = <i>$FAIL</i> <b>($ATTEMPTS)</b>

    # Цвет при Caps Lock — оранжевый
    capslock_color = rgba(245, 194, 231, 0.9)

    fade_on_empty = true             # плавное исчезновение когда пусто
    fade_timeout = 2000              # задержка fade (мс)
    placeholder_text = <i>Enter password...</i>
    font_family = JetBrains Mono Nerd Font
    rounding = 12                    # скруглённые углы (как окна niri)

    position = 0, -80                # 80px вниз от центра
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# --- Текущая раскладка клавиатуры (внизу) ---
label {
    monitor =
    text = $LAYOUT[EN, RU]           # показывает EN или RU
    color = rgba(255, 255, 255, 0.4)
    font_size = 16
    font_family = JetBrains Mono Nerd Font

    position = 0, -160               # внизу экрана
    halign = center
    valign = center
}