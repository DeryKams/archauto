# =============================================================================
# fuzzel/fuzzel.ini — Конфигурация лаунчера приложений
# Liquid glass: полупрозрачный фон + скруглённые углы.
# niri layer-rule добавляет blur за fuzzel.
# =============================================================================

# --- Основные настройки ---
[main]
font=JetBrains Mono Nerd Font:size=13
dpi-aware=no                    # не масштабировать шрифт по DPI (фиксированный размер)
prompt="❯ "                     # символ приглашения
icon-theme=Papirus              # тема иконок (нужно установить papirus-icon-theme)
terminal=foot                   # терминал для запуска приложений по умолчанию
launch-prefix=                  # без префикса (можно добавить "exec " для логирования)
list-executables-in-path=yes    # показывать бинарники из PATH
fields=filename,name,generic,categories,keywords  # поля поиска

# --- Размеры и расположение ---
width=40                        # ширина в процентах от экрана
lines=15                        # количество строк (пунктов)
horizontal-pad=16               # горизонтальный отступ внутри
vertical-pad=10                 # вертикальный отступ внутри
inner-pad=6                     # отступ между пунктами

# --- Цвета (liquid glass) ---
# Фон полупрозрачный — niri layer-rule добавит blur
# Цвета в формате RRGGBB (непрозрачный) или RR GG BB AA (полупрозрачный)
[colors]
background=1e1e2eee             # тёмно-синий фон с 93% непрозрачностью
text=cdd6f4ff                   # светло-лавандовый текст
match=89b4faff                  # голубой для совпадений
selection=313244ff              # тёмно-серый для выделения
selection-text=cdd6f4ff        # текст при выделении
selection-match=89b4faff       # голубой для совпадений при выделении
border=89b4faff                 # голубая рамка (как focus-ring в niri)
# border-width задаётся в [main] ниже

# --- Рамка ---
[border]
width=2                         # толщина рамки (px)
radius=12                        # скруглённые углы (соответствует niri window-rule)

# --- Поведение клавиш ---
[key-bindings]
# По умолчанию: Enter — запуск, Escape — отмена, Ctrl+d — удалить символ
# Стрелки вверх/вниз или Ctrl+p/Ctrl+n — навигация по списку
# Можно переопределить, но значения по умолчанию стандартны и удобны