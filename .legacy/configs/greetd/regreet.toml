# regreet.toml — экран входа greetd/regreet
# Стилизован под hyprlock: те же шрифт, цвета, обои

[background]
# Путь к обоям общий с hyprlock (screenshot недоступен на экране входа)
path = "/usr/share/backgrounds/greeter.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
cursor_blink = true
# Шрифт синхронизирован с hyprlock
font_name = "JetBrains Mono Nerd Font 12"
icon_theme_name = "Adwaita"
# Тёмная тема, как в hyprlock
theme_name = "Adwaita-dark"

[appearance]
greeting_msg = "Welcome"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[widget.clock]
# Формат часов как в hyprlock ($TIME = %H:%M)
format = "%H:%M"
resolution = "500ms"
label_width = 150
